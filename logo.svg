<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f0a"/>
      <stop offset="100%" style="stop-color:#0d1a0d"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="100%" style="stop-color:#39d353"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="rgba(0,255,65,0.03)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="160" rx="10" fill="url(#bgGrad)"/>
  <rect width="400" height="160" rx="10" fill="url(#scanlines)"/>
  <rect width="400" height="160" rx="10" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.25"/>
  <rect width="400" height="160" rx="10" fill="none" stroke="#00ff41" stroke-width="3" opacity="0.06"/>

  <!-- Top terminal bar -->
  <rect width="400" height="28" rx="10" fill="#050d05"/>
  <rect x="0" y="18" width="400" height="10" fill="#050d05"/>
  <line x1="0" y1="28" x2="400" y2="28" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>

  <!-- Terminal dots -->
  <circle cx="22" cy="14" r="4" fill="#ff5f57" opacity="0.85"/>
  <circle cx="36" cy="14" r="4" fill="#febc2e" opacity="0.85"/>
  <circle cx="50" cy="14" r="4" fill="#28c840" opacity="0.85"/>

  <!-- Top bar title -->
  <text x="200" y="19" font-family="'Courier New', monospace" font-size="10" fill="#00ff41"
        text-anchor="middle" opacity="0.5">bash — kevin@42antan: ~</text>

  <!-- Main ./ symbol -->
  <text x="28" y="118" font-family="'Courier New', monospace" font-size="78" font-weight="bold"
        fill="url(#greenGrad)" filter="url(#glow)">./</text>

  <!-- Vertical separator -->
  <line x1="178" y1="42" x2="178" y2="148" stroke="#00ff41" stroke-width="0.8" opacity="0.2"/>

  <!-- Prompt line -->
  <text x="196" y="68" font-family="'Courier New', monospace" font-size="11" fill="#00ff41" opacity="0.45">kevin@42antan:~$</text>

  <!-- Name -->
  <text x="196" y="92" font-family="'Courier New', monospace" font-size="19" font-weight="bold"
        fill="#00ff41" filter="url(#glowSoft)" letter-spacing="1.5">AINA KEVIN</text>

  <!-- Divider -->
  <line x1="196" y1="100" x2="378" y2="100" stroke="#00ff41" stroke-width="0.5" opacity="0.25"/>

  <!-- Role -->
  <text x="196" y="116" font-family="'Courier New', monospace" font-size="11" fill="#39d353" opacity="0.8">
    <tspan fill="#00ff41" opacity="0.5">&gt; </tspan>Etudiant Informatique
  </text>

  <!-- Schools -->
  <text x="196" y="131" font-family="'Courier New', monospace" font-size="9.5" fill="#1a6b1a" letter-spacing="0.3">42 Antananarivo · ISPM Madagascar</text>

  <!-- Status + blinking cursor -->
  <text x="196" y="148" font-family="'Courier New', monospace" font-size="9" fill="#00ff41" opacity="0.35">[open to work] ▮</text>
</svg>
